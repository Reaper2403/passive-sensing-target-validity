name: Verify report package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e .
      - name: Audit public files
        run: python scripts/public_release_audit.py
      - name: Check documentation links
        run: python scripts/check_markdown_links.py
      - name: Verify report evidence
        run: python scripts/verify_public_artifacts.py
      - name: Test
        run: python -m pytest
