[project]
name = "passive-sensing-target-validity"
version = "1.0.0"
description = "Reproducible target validation and behavioral forecasting analyses for GLOBEM."
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py310"
